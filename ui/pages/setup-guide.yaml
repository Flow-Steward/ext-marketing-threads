page_id: setup-guide
title: Setup Guide
description: What you need before the first Threads step runs.
components:
  - component_id: setup_steps
    type: markdown
    title: Set up
    body: |
      1. In the [Meta App Dashboard](https://developers.facebook.com/apps/), create an app with the **Access the Threads API** use case. Until Meta approves your app, it works only for the Threads accounts added as testers.
      2. Choose the permissions your steps need: `threads_basic` always; `threads_content_publish` to publish; `threads_read_replies` and `threads_manage_replies` for replies; `threads_manage_insights` for insights; `threads_delete` to delete; `threads_keyword_search`, `threads_location_tagging`, `threads_manage_mentions` and `threads_profile_discovery` for the steps that name them.
      3. Authorize the Threads account in your app and get a long-lived user access token, as Meta's [Get access tokens](https://developers.facebook.com/documentation/threads/get-started/get-access-tokens-and-permissions) and [Long-lived tokens](https://developers.facebook.com/documentation/threads/get-started/long-lived-tokens) guides describe.
      4. On the **Connection** page, create a connection and paste the token. Press **Test connection**.
      5. Build a workflow: for example, on a schedule → **Publish a post** with text prepared by an earlier step → **Get post insights** a day later.
  - component_id: setup_media
    type: markdown
    title: Images and videos
    body: |
      Threads downloads every image and video itself from a public address. Put the file where Threads can reach it (your website, a CDN or public storage) and give its address to **Publish a post**. Images: JPEG or PNG, up to 8 MB. Videos: MP4 or MOV, up to 1 GB and 5 minutes. A carousel holds 2 to 20 images and videos.
  - component_id: setup_limits
    type: markdown
    title: Limits
    body: |
      In 24 hours a Threads account may publish 250 posts and 1000 replies, delete 100 posts and run 500 location searches; keyword search allows 2200 queries. A post holds up to 500 characters and 5 links.
