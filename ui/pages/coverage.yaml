- component_id: coverage_summary
  type: markdown
  title: Coverage
  body: |
    Threads publishes no machine-readable specification. The steps are built from its documentation pages (downloaded 2026-11-23, each pinned by SHA-256), API version v1.0 on graph.threads.com.

    The reference pages document 26 endpoints and the guides 5 more; **25 have their own step**: 19 reads and 6 changes. Test runs send reads and never send changes.

    Not offered as steps, and why:

    - `GET /debug_token` — Its input_token parameter is itself an access token, and this extension never takes tokens as step inputs; the documentation also asks for an app access token, or for a tester's user access token.
    - `GET /trending_topics` — Needs the Threads Trending Topics feature and an app access token, TH|app ID|app secret; a connection holds a user access token.
    - `GET /{trend-id}/posts` — Needs advanced access to the Threads Trending Topics feature and an app access token; a connection holds a user access token.
    - `POST /oauth/access_token` — Exchanges an authorization code for a short-lived token. The connection holds a long-lived access token, entered in the connection form after Meta's authorization flow; a step never handles codes or the app secret.
    - `GET /access_token` — Exchanges a short-lived for a long-lived token, with the app secret. Tokens are the connection's, never step inputs or outputs.
    - `GET /refresh_access_token` — Refreshes a long-lived token; tokens are the connection's, never step inputs or outputs, and this extension does not store tokens.

    Webhooks (notifications about replies, mentions, publishing and deletion) are set up in the Meta App Dashboard, not through an endpoint, and are not part of this release.
