page_id: threads-api
title: Threads API
description: How the Threads steps work, and every step.
components:
- component_id: api_overview
  type: markdown
  title: How the steps work
  body: |
    The steps call the Threads API for the connected account: 34 steps, the everyday ones first.

    - **Permissions.** Each step names the Threads permissions it needs. They must be granted to the connection's access token, or Threads refuses the step and nothing changes.
    - **Results.** A read returns `data` (Threads' JSON) or, for a list, `items` with `next_after` to continue; every step returns `warnings` and `rate_limit_usage`.
    - **Lists.** A list step reads one page; with `all_pages` it reads every page and stops with `complete` false and `next_after` when the output is full or time runs out.
    - **Media.** Threads downloads images and videos from public addresses; give the address, not a file.
    - **Accepted or completed.** A media container is `accepted` until Threads has processed it; read its status and publish it when it is `FINISHED`.
    - **Changes are sent once.** A step that changes data is never retried automatically; when its outcome is unclear it says so, and you check Threads before running it again. Test runs never send changes.
- component_id: steps_everyday
  type: markdown
  title: Everyday
  body: |
    - **Test connection** (`test_connection`, reads only; `GET /{threads-user-id}`) — Checks the connection: reads the account it belongs to (GET /me with id, username and name) and returns its user ID and username. Needs threads_basic.
    - **Get my profile** (`get_my_profile`, reads only; `GET /{threads-user-id}`) — Reads the connected account's Threads profile: ID, username, name, profile picture, biography and whether it is verified (or the fields you choose, including recently_searched_keywords). Needs threads_basic.
    - **Get all my posts** (`list_my_posts`, reads only; `GET /{threads-user-id}/threads`) — Reads the connected account's posts page by page (GET /me/threads, 100 per page) until all are read, the step output is full, the asked maximum is reached or time runs out; then it returns what it read with complete false and next_after to continue from. Optionally only posts from since to until. Each post has every documented field unless you choose fewer. Needs threads_basic.
    - **Publish a post** (`publish_post`, changes data in Threads; `POST /{threads-user-id}/threads`, `GET /{threads-container-id}`, `POST /{threads-user-id}/threads_publish`, `GET /{threads-media-id}`) — Publishes a text, image, video or carousel post on the connected account, as Threads documents it: creates the media container (for a carousel one container per image or video first), reads its status once a minute until it is FINISHED (at most five times, as Threads recommends) and publishes it. Images and videos are public addresses that Threads downloads. Returns the post ID and permalink. When Threads is still processing the media, the step returns processing accepted and the container ID: publish it later with Publish media container. Needs threads_basic and threads_content_publish. Threads allows 250 published posts per 24 hours.
    - **Reply to a post** (`reply_to_post`, changes data in Threads; `POST /{threads-user-id}/threads`, `GET /{threads-container-id}`, `POST /{threads-user-id}/threads_publish`, `GET /{threads-media-id}`) — Publishes a reply to a post or to another reply: text, or an image or video with optional text, through the same container, status and publish requests as Publish a post (reply_to_id). Returns the reply ID and permalink, or processing accepted and the container ID when Threads is still processing the media. Needs threads_basic, threads_content_publish and threads_manage_replies. Threads allows 1000 replies per 24 hours.
    - **Get all replies to a post** (`list_post_replies`, reads only; `GET /{threads-media-id}/replies`, `GET /{threads-media-id}/conversation`) — Reads the replies to a post page by page until all are read: the top-level replies (GET /{id}/replies), or with include_nested every reply at every level (GET /{id}/conversation). Stops with complete false and next_after when the output is full, the maximum is reached or time runs out. Needs threads_basic and threads_read_replies.
    - **Get post insights** (`get_post_insights`, reads only; `GET /{threads-media-id}/insights`) — Reads a post's metrics: views, likes, replies, reposts, quotes and shares (or the ones you choose), each as one number in metrics. Needs threads_basic and threads_manage_insights.
    - **Get account insights** (`get_account_insights`, reads only; `GET /{threads-user-id}/threads_insights`) — Reads the connected account's metrics: views (a value per day), likes, replies, reposts, quotes, link clicks and followers, or follower demographics by country, city, age or gender. Optionally from since to until (from 13 April 2024; followers and demographics take no period). Without a period Threads reads yesterday and today. Needs threads_basic and threads_manage_insights.
    - **Get publishing limits** (`get_publishing_limit`, reads only; `GET /{threads-user-id}/threads_publishing_limit`) — Reads how much of its 24-hour limits the connected account has used: posts (250), replies (1000), deletions (100) and location searches (500), each with the limit and its window, as Threads reports them. Needs threads_basic and threads_content_publish (replies also threads_manage_replies, deletions threads_delete, location searches threads_location_tagging).
- component_id: steps_publishing
  type: markdown
  title: Publishing
  body: |
    - **Create media container** (`create_media_container`, changes data in Threads; `POST /{threads-user-id}/threads`) — Upload media and create media containers. Threads processes the container before it can be published: the step returns processing accepted and the container ID; read its status with Get media container status and publish it with Publish media container. A TEXT container with auto_publish_text true is published by Threads without the publish step: then processing is completed, applied true and no check. Needs threads_basic, threads_content_publish.
    - **Delete a post** (`delete_post`, changes data in Threads; `DELETE /{threads-media-id}`) — Delete a Threads post. Needs threads_basic, threads_delete.
    - **Get media container status** (`get_media_container_status`, reads only; `GET /{threads-container-id}`) — Check the Threads media container publishing eligibility and status. Needs threads_basic, threads_content_publish.
    - **Publish media container** (`publish_media_container`, changes data in Threads; `POST /{threads-user-id}/threads_publish`) — Publish uploaded media using their media containers. Needs threads_basic, threads_content_publish.
    - **Repost a post** (`repost_post`, changes data in Threads; `POST /{threads-media-id}/repost`) — Repost a Threads post that was previously published. Needs threads_basic, threads_content_publish.
- component_id: steps_posts
  type: markdown
  title: Posts
  body: |
    - **Get embed HTML** (`get_embed_html`, reads only; `GET /oembed`) — Retrieve the embed HTML code snippet and metadata of a post or profile. The documentation calls it without an access token; none is sent.
    - **Get post** (`get_post`, reads only; `GET /{threads-media-id}`) — Retrieve a Threads media object. Needs threads_basic.
    - **Search posts by keyword or topic** (`search_posts`, reads only; `GET /keyword_search`) — Search for public Threads media with specific keywords or topic tags. Needs threads_basic, threads_keyword_search.
- component_id: steps_replies
  type: markdown
  title: Replies
  body: |
    - **Approve or ignore a pending reply** (`approve_or_ignore_pending_reply`, changes data in Threads; `POST /{threads-reply-id}/manage_pending_reply`) — Approve or ignore a pending reply on your Threads post. Needs threads_basic, threads_manage_replies.
    - **Get pending replies** (`get_pending_replies`, reads only; `GET /{threads-media-id}/pending_replies`) — Retrieve a paginated list of all pending replies for a Threads media object. Returns one page (items and next_after to continue from); with all_pages true it reads every page until the list ends, the output is full or max_items is reached. Needs threads_basic, threads_read_replies.
    - **Get the conversation of a post** (`get_post_conversation`, reads only; `GET /{threads-media-id}/conversation`) — Retrieve a paginated and flattened list of all top-level and nested replies for a Threads media object. Returns one page (items and next_after to continue from); with all_pages true it reads every page until the list ends, the output is full or max_items is reached. Needs threads_basic, threads_read_replies.
    - **Get replies to a post** (`get_post_replies`, reads only; `GET /{threads-media-id}/replies`) — Retrieve a paginated list of all top-level replies for a Threads media object. Returns one page (items and next_after to continue from); with all_pages true it reads every page until the list ends, the output is full or max_items is reached. Needs threads_basic, threads_read_replies.
    - **Hide or unhide a reply** (`hide_or_unhide_reply`, changes data in Threads; `POST /{threads-reply-id}/manage_reply`) — Hide or unhide a top-level reply on your Threads post. Needs threads_basic, threads_manage_replies.
- component_id: steps_profiles
  type: markdown
  title: Profiles
  body: |
    - **Get a public profile's posts** (`get_public_profile_posts`, reads only; `GET /profile_posts`) — Look up a public profile and retrieve its posts on Threads. Returns one page (items and next_after to continue from); with all_pages true it reads every page until the list ends, the output is full or max_items is reached. Needs threads_basic, threads_profile_discovery.
    - **Get publishing limit usage** (`get_publishing_limit_usage`, reads only; `GET /{threads-user-id}/threads_publishing_limit`) — Check the app user's current publishing rate limit usage. Needs threads_basic, threads_content_publish.
    - **Get user ghost posts** (`get_user_ghost_posts`, reads only; `GET /{threads-user-id}/ghost_posts`) — Retrieve a paginated list of all Threads ghost posts created by a user. Returns one page (items and next_after to continue from); with all_pages true it reads every page until the list ends, the output is full or max_items is reached. Needs threads_basic.
    - **Get user mentions** (`get_user_mentions`, reads only; `GET /{threads-user-id}/mentions`) — Retrieve a paginated list of all Threads posts where a user is mentioned. Returns one page (items and next_after to continue from); with all_pages true it reads every page until the list ends, the output is full or max_items is reached. Needs threads_basic, threads_manage_mentions.
    - **Get user posts** (`get_user_posts`, reads only; `GET /{threads-user-id}/threads`) — Retrieve a paginated list of all Threads posts created by a user. Returns one page (items and next_after to continue from); with all_pages true it reads every page until the list ends, the output is full or max_items is reached. Needs threads_basic.
    - **Get user profile** (`get_user_profile`, reads only; `GET /{threads-user-id}`) — {#get---threads-user-id--fields-id-username----}. Needs threads_basic.
    - **Get user replies** (`get_user_replies`, reads only; `GET /{threads-user-id}/replies`) — Retrieve a paginated list of all Threads replies created by a user. Returns one page (items and next_after to continue from); with all_pages true it reads every page until the list ends, the output is full or max_items is reached. Needs threads_basic, threads_read_replies.
    - **Look up a public profile** (`look_up_public_profile`, reads only; `GET /profile_lookup`) — Look up a public profile and retrieve its basic profile information. Needs threads_basic, threads_profile_discovery.
- component_id: steps_locations
  type: markdown
  title: Locations
  body: |
    - **Get location** (`get_location`, reads only; `GET /{location-id}`) — Retrieve a location by its ID. Needs threads_basic, threads_location_tagging.
    - **Search locations** (`search_locations`, reads only; `GET /location_search`) — Search for locations by query or by coordinates. Needs threads_basic, threads_location_tagging.
- component_id: steps_insights
  type: markdown
  title: Insights
  body: |
    - **Get media insights** (`get_media_insights`, reads only; `GET /{threads-media-id}/insights`) — Retrieve insights for a Threads media object. Needs threads_basic, threads_manage_insights.
    - **Get user insights** (`get_user_insights`, reads only; `GET /{threads-user-id}/threads_insights`) — Retrieve insights for a Threads user. Needs threads_basic, threads_manage_insights.
