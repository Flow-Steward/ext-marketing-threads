page_id: changelog
title: Changelog
description: What changed in each version.
components:
  - component_id: changelog_0_1_2
    type: markdown
    title: 0.1.2
    body: |
      - Every input has one readable label in every step; inputs that mean the same are described the same.
      - New pages: a detailed Setup Guide (the Meta app, permissions, testers, getting and renewing the token, media, limits, errors), one page per area of the Threads API, and Threads API coverage with every step's endpoint, inputs and returned fields, generated from the pinned documentation.
      - A detailed README with what you can automate.
  - component_id: changelog_0_1_1
    type: markdown
    title: 0.1.1
    body: |
      - The tests check the install folder from the extension id, so they pass in the repository's own checkout.
  - component_id: changelog_0_1_0
    type: markdown
    title: 0.1.0
    body: |
      First version.

      - Everyday steps: test the connection, get my profile, get all my posts, publish a text, image, video or carousel post, reply to a post or reply, get all replies to a post, get post and account insights, get publishing limits.
      - A step for each of the 25 Threads API endpoints this release covers, built from the Threads documentation.
