page_id: connection
title: Connection
description: Connect a Threads account to this project.
project_scoped: true
components:
  - component_id: threads_connection
    type: connection_form
    title: Threads account
    description: Create one connection per Threads account. Flow Steward keeps the access token, encrypted, and never shows it again.
    data:
      connection_kind: extension
      connection_type: threads_account
      config_fields: []
      secret_fields:
        - access_token
      required_secret_fields:
        - access_token
      test_action: test_connection
    defaults:
      display_name: Threads
    fields:
      - path: display_name
        label: Connection name
        widget: text
      - path: access_token
        label: Threads user access token
        widget: secret
        required: true
        help: The Threads user access token. Long-lived (valid 60 days), with the permissions your steps name.
  - component_id: connection_token
    type: markdown
    title: Where to get the access token
    body: |
      Threads gives the app the account owner authorized an access token, as described in Meta's [Get access tokens](https://developers.facebook.com/documentation/threads/get-started/get-access-tokens-and-permissions) guide. That one is short-lived (one hour); exchange it for a long-lived one (60 days) as described in [Long-lived tokens](https://developers.facebook.com/documentation/threads/get-started/long-lived-tokens), and paste it here.

      You obtain and renew the long-lived access token, yourself; per Meta's documentation it is valid for 60 days. The extension's steps never issue or renew tokens: Threads makes tokens long-lived or renews them only with its own requests and your app secret. Before the 60 days are over, refresh it as Meta describes and save the new one here.
  - component_id: connection_help
    anchor_id: if-it-fails
    type: markdown
    title: If it fails
    body: |
      - **Threads no longer accepts the access token**, because it expired or was withdrawn (Threads error code 190) — get a new long-lived one and save it here.
      - **A permission the step needs is missing from the access token** (code 10 or 200–299) — authorize the permission the step names (for example `threads_content_publish` to publish) and save the new one.
      - **A rate limit is reached** (codes 4, 17, 32, 613) — wait and run the step again; **Get publishing limits** shows how much of the 24-hour limits is used.
