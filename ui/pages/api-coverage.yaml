    ## Everyday

    ### Test connection (`test_connection`)

    Threads: `GET /{threads-user-id}`.

    Inputs: none.

    Returns: `connected`, `user_id`, `username`, `warnings`, `rate_limit_usage`.

    ### Get my profile (`get_my_profile`)

    Threads: `GET /{threads-user-id}`.

    Inputs: `fields`.

    Returns: `profile`, `warnings`, `rate_limit_usage`.

    ### Get all my posts (`list_my_posts`)

    Threads: `GET /{threads-user-id}/threads`.

    Inputs: `since`, `until`, `fields`, `after`, `max_posts`.

    Returns: `posts`, `count`, `complete`, `next_after`, `warnings`, `rate_limit_usage`.

    ### Publish a post (`publish_post`)

    Threads: `POST /{threads-user-id}/threads`, `GET /{threads-container-id}`, `POST /{threads-user-id}/threads_publish`, `GET /{threads-media-id}`.

    Inputs: `media_type` (required), `text`, `image_url`, `video_url`, `alt_text`, `items`, `link_attachment`, `reply_control`, `topic_tag`, `quote_post_id`, `location_id`, `is_made_with_ai`.

    Returns: `post_id`, `permalink`, `container_id`, `item_container_ids`, `container_status`, `status_checks`, `processing`, `applied`, `check`, `warnings`, `rate_limit_usage`.

    ### Reply to a post (`reply_to_post`)

    Threads: `POST /{threads-user-id}/threads`, `GET /{threads-container-id}`, `POST /{threads-user-id}/threads_publish`, `GET /{threads-media-id}`.

    Inputs: `reply_to_id` (required), `text`, `image_url`, `video_url`, `alt_text`, `reply_control`.

    Returns: `reply_id`, `permalink`, `container_id`, `item_container_ids`, `container_status`, `status_checks`, `processing`, `applied`, `check`, `warnings`, `rate_limit_usage`.

    ### Get all replies to a post (`list_post_replies`)

    Threads: `GET /{threads-media-id}/replies`, `GET /{threads-media-id}/conversation`.

    Inputs: `post_id` (required), `include_nested`, `reverse`, `fields`, `after`, `max_replies`.

    Returns: `replies`, `count`, `complete`, `next_after`, `warnings`, `rate_limit_usage`.

    ### Get post insights (`get_post_insights`)

    Threads: `GET /{threads-media-id}/insights`.

    Inputs: `post_id` (required), `metrics`.

    Returns: `metrics`, `data`, `warnings`, `rate_limit_usage`.

    ### Get account insights (`get_account_insights`)

    Threads: `GET /{threads-user-id}/threads_insights`.

    Inputs: `metrics`, `since`, `until`, `breakdown`.

    Returns: `metrics`, `data`, `warnings`, `rate_limit_usage`.

    ### Get publishing limits (`get_publishing_limit`)

    Threads: `GET /{threads-user-id}/threads_publishing_limit`.

    Inputs: none.

    Returns: `posts`, `replies`, `deletes`, `location_searches`, `warnings`, `rate_limit_usage`.

    ## Publishing

    ### Create media container (`create_media_container`)

    Threads: `POST /{threads-user-id}/threads`.

    Documented on: reference_publishing.

    Inputs: `threads_user_id`, `media_type` (required), `text`, `image_url`, `video_url`, `is_made_with_ai`, `is_carousel_item`, `children`, `reply_to_id`, `reply_control`, `allowlisted_country_codes`, `alt_text`, `link_attachment`, `quote_post_id`, `poll_attachment`, `auto_publish_text`, `topic_tag`, `is_spoiler_media`, `text_entities`, `text_attachment`, `gif_attachment`, `is_ghost_post`, `enable_reply_approvals`, `crossreshare_to_ig`, `crossreshare_to_ig_dark_mode`, `location_id`.

    Returns the `id` Threads gives (in `id` and `data`).

    ### Delete a post (`delete_post`)

    Threads: `DELETE /{threads-media-id}`.

    Documented on: reference_publishing.

    Inputs: `threads_media_id` (required).

    Returns Threads' confirmation (`success`) in `data`.

    ### Get media container status (`get_media_container_status`)

    Threads: `GET /{threads-container-id}`.

    Documented on: reference_publishing.

    Inputs: `threads_container_id` (required), `fields`.

    Returns the fields asked for in `fields`, from: `id`, `status`, `error_message`.

    ### Publish media container (`publish_media_container`)

    Threads: `POST /{threads-user-id}/threads_publish`.

    Documented on: reference_publishing.

    Inputs: `threads_user_id`, `creation_id` (required).

    Returns the `id` Threads gives (in `id` and `data`).

    ### Repost a post (`repost_post`)

    Threads: `POST /{threads-media-id}/repost`.

    Documented on: reference_publishing.

    Inputs: `threads_media_id` (required).

    Returns the `id` Threads gives (in `id` and `data`).

