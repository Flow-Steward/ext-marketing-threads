    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100000
      title: At most
      description: The most to read in this step. Default 10000.
  outputs:
  - name: replies
    value_type: array
    schema:
      type: array
      items:
        type: object
        additionalProperties: true
      description: The replies, as Threads returns them.
  - name: count
    value_type: integer
    schema:
      type: integer
      description: How many were returned.
  - name: complete
    value_type: boolean
    schema:
      type: boolean
      description: True when the list was read to its end.
  - name: next_after
    value_type: text
    schema:
      type:
      - string
      - 'null'
