  description: 'Publishes a text, image, video or carousel post on the connected account, as Threads documents
    it: creates the media container (for a carousel one container per image or video first), reads its
    status once a minute until it is FINISHED (at most five times, as Threads recommends) and publishes
    it. Images and videos are public addresses that Threads downloads. Returns the post ID and permalink.
    When Threads is still processing the media, the step returns processing accepted and the container
    ID: publish it later with Publish media container. Needs threads_basic and threads_content_publish.
    Threads allows 250 published posts per 24 hours.'
  operation_kind: action
  category: marketing
  connection_type_ids:
  - threads_account
  workflow_visible: true
  effect_kind: threads_publish_post
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
