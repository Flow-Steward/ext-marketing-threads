    value_type: connection_ref
    required: true
  - name: post_id
    value_type: text
    required: true
    schema:
      type: string
      maxLength: 30
      title: Post ID
      description: The post whose replies to read.
  - name: include_nested
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Nested replies too
      description: True for replies at every level (the conversation), false or empty for top-level replies.
  - name: reverse
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: Newest first
      description: True (Threads' default) for reverse chronological order, false for oldest first.
  - name: fields
    value_type: array
    required: false
    schema:
      type: array
      items:
        type: string
      title: Fields
      description: 'The reply fields to read. Default: every documented field of a reply.'
  - name: after
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2048
      title: Continue after
      description: 'next_after of an earlier run, to continue where it stopped. Empty: from the start.'
  - name: max_replies
