    schema:
      type: string
      enum:
      - TEXT
      - IMAGE
      - VIDEO
      - CAROUSEL
      title: Kind of post
      description: TEXT, IMAGE, VIDEO or CAROUSEL (2 to 20 images and videos).
  - name: text
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 500
      title: Text
      description: The text of the post, up to 500 characters (Threads counts an emoji as its UTF-8 bytes).
        Required for a text post.
  - name: image_url
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: Image address
      description: A public address of a JPEG or PNG image (up to 8 MB). Threads takes media only from
        a public URL, which it downloads itself; a workflow file must first be published at a public URL.
  - name: video_url
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: Video address
      description: A public address of an MP4 or MOV video (up to 1 GB, 5 minutes). Threads takes media
        only from a public URL, which it downloads itself; a workflow file must first be published at
