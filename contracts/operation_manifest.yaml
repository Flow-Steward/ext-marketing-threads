- operation_id: create_media_container
  display_name: Create media container
  description: 'Upload media and create media containers. Threads processes the container before it can
    be published: the step returns processing accepted and the container ID; read its status with Get
    media container status and publish it with Publish media container. A TEXT container with auto_publish_text
    true is published by Threads without the publish step: then processing is completed, applied true
    and no check. Needs threads_basic, threads_content_publish.'
  operation_kind: action
  category: marketing
  connection_type_ids:
  - threads_account
  workflow_visible: true
  effect_kind: threads_create_media_container
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: threads_user_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 30
      title: Threads user ID
      description: The Threads user ID, or me for the connected account (the default).
  - name: media_type
    value_type: text
    required: true
    schema:
      type: string
      maxLength: 1000
      enum:
      - TEXT
      - IMAGE
      - VIDEO
      - CAROUSEL
      title: media_type
      description: 'The type of media container to create. Values: `TEXT`, `IMAGE`, `VIDEO`, `CAROUSEL`'
  - name: text
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 500
      title: text
      description: 'The text associated with the post. Uses UTF-8 encoding. Required for text-only posts.
        Note: For the post character limit, emojis are counted as the number of UTF-8 bytes.'
  - name: image_url
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: image_url
      description: The public URL of the image. Required if `media_type=IMAGE`. Threads takes media only
        from a public URL, which it downloads itself; a workflow file must first be published at a public
        URL.
  - name: video_url
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: video_url
      description: The public URL of the video. Required if `media_type=VIDEO`. Threads takes media only
        from a public URL, which it downloads itself; a workflow file must first be published at a public
        URL.
  - name: is_made_with_ai
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: is_made_with_ai
      description: 'Set to `true` to disclose that a post contains AI-generated content and display the
        AI info label. Supported for `TEXT`, `IMAGE`, `VIDEO`, and `CAROUSEL` posts. Values: `true`, `false`
        (default) Set this parameter when creating the media container, not when calling `POST /{threads-user-id}/threads_publish`.
        For carousels, set it on the parent container. Setting `is_made_with_ai=true` on an individual
        carousel item (`is_carousel_item=true`) returns an error. Omitting this parameter or setting it
        to `false` does not add an AI self-disclosure. It does not prevent automatic AI labeling. See
        Label '
  - name: is_carousel_item
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: is_carousel_item
      description: 'Set to `true` if this container is an item in a carousel. Values: `true`, `false`
        (default)'
  - name: children
    value_type: array
    required: false
    schema:
      type: array
      items:
        type: string
      minItems: 2
      maxItems: 20
      title: children
      description: A comma-separated list of the media container IDs of the carousel items. Required if
        `media_type=CAROUSEL`. Give a list; it is sent comma-separated.
  - name: reply_to_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 30
      title: reply_to_id
      description: The ID of the post to reply to. Required if replying to a post.
  - name: reply_control
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 1000
      enum:
      - everyone
      - accounts_you_follow
      - mentioned_only
      - parent_post_author_only
      - followers_only
      title: reply_control
      description: 'Specifies who can reply to the post. Values: `everyone`, `accounts_you_follow`, `mentioned_only`,
        `parent_post_author_only`, `followers_only`'
  - name: allowlisted_country_codes
    value_type: array
    required: false
    schema:
      type: array
      items:
        type: string
      title: allowlisted_country_codes
      description: A list of valid ISO 3166-1 alpha-2 country codes that represents the countries where
        this media should be shown. If this parameter is passed in, the media is not shown to Threads
        profiles in countries outside of this list. Give a list; it is sent comma-separated.
  - name: alt_text
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 1000
      title: alt_text
      description: 'The accessibility text label or description for an image or video in a Threads post.
        Note: The maximum length of `alt_text` is 1,000 characters.'
  - name: link_attachment
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 2000
      title: link_attachment
      description: The URL attached to a Threads post.
  - name: quote_post_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 30
      title: quote_post_id
      description: ID of the post to quote.
  - name: poll_attachment
    value_type: object
    required: false
    schema:
      type: object
      additionalProperties: true
      title: poll_attachment
      description: The options for a post with a poll attachment. Give a JSON object; it is sent as JSON
        text.
  - name: auto_publish_text
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: auto_publish_text
      description: 'When set to `true`, a Threads post is published automatically when a Threads media
        container is created without needing to go through the extra publish step. Note: This only works
        for text posts.'
  - name: topic_tag
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 50
      title: topic_tag
      description: 'The topic to add to a post. Note: The following characters are not allowed in topic
        tags: Periods (.) Ampersands (&)'
  - name: is_spoiler_media
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: is_spoiler_media
      description: 'Whether the media should be a spoiler. Values: `true`, `false`'
  - name: text_entities
    value_type: object
    required: false
    schema:
      type: object
      additionalProperties: true
      title: text_entities
      description: The spoiler settings for the post. Give a JSON object; it is sent as JSON text.
  - name: text_attachment
    value_type: object
    required: false
    schema:
      type: object
      additionalProperties: true
      title: text_attachment
      description: The text attachment for the post. Give a JSON object; it is sent as JSON text.
  - name: gif_attachment
    value_type: object
    required: false
    schema:
      type: object
      additionalProperties: true
      title: gif_attachment
      description: 'The ID and GIF provider for the GIF to attach to the post. Fields: `gif_id`, `provider`
        Give a JSON object; it is sent as JSON text.'
  - name: is_ghost_post
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: is_ghost_post
      description: 'Whether the post is a ghost post. Values: `true`, `false`'
  - name: enable_reply_approvals
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: enable_reply_approvals
      description: 'Whether the post should have reply approvals enabled. Values: `true`, `false`'
  - name: crossreshare_to_ig
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: crossreshare_to_ig
      description: 'Cross-shares a Threads post to a linked Instagram account as a Story when set to `true`.
        Values: `true`, `false` (default)'
  - name: crossreshare_to_ig_dark_mode
    value_type: boolean
    required: false
    schema:
      type: boolean
      title: crossreshare_to_ig_dark_mode
      description: 'Cross-shares a Threads post to a linked Instagram account as a Story in dark mode
        when set to `true`. Values: `true`, `false` (default)'
  - name: location_id
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 30
      title: location_id
      description: 'The ID of the location to tag. Note: Use the `GET /location_search` endpoint to find
        location IDs.'
  outputs:
  - name: status
    value_type: integer
    schema:
      type:
      - integer
      - 'null'
      description: Threads' HTTP status (none in a test run).
  - name: data
    value_type: object
    schema:
      type:
      - object
      - 'null'
      additionalProperties: true
      description: What Threads returned (JSON).
  - name: id
    value_type: text
    schema:
      type:
      - string
      - 'null'
      description: The ID Threads returned (container, post or repost); empty for a write that returns
        none.
  - name: processing
    value_type: text
    schema:
      type: *id009
      enum: *id010
      description: 'completed: Threads made the change. accepted: Threads created the media container
        and is still processing it; nothing is published yet, check its status with the step named in
        check. Empty in a test run and when nothing was sent.'
  - name: applied
    value_type: boolean
    schema:
      type: *id011
      description: True with processing completed; false with accepted, in a test run and when nothing
        was sent.
  - name: check
    value_type: object
    schema:
      type: *id012
      additionalProperties: true
      description: 'With processing accepted: operation_id, the step that reads the container''s status,
        and container_id.'
  - name: warnings
    value_type: array
    schema:
      type: array
      items: *id001
      description: What the step could not do fully or what to check.
  - name: rate_limit_usage
    value_type: object
    schema:
      type: *id002
      additionalProperties: true
      description: 'The rate-limit usage Threads reported with the last answer, by header (X-App-Usage,
        X-Business-Use-Case-Usage: percentages of the limit used); empty when Threads sent none.'
  - name: external_effect_status
    value_type: text
    schema:
      type: string
  - name: definitely_no_external_effect
    value_type: boolean
    schema:
      type: boolean
  result_fields:
  - result.status
  - result.data
  - result.id
  - result.processing
  - result.applied
  - result.check
  - result.warnings
  - result.rate_limit_usage
  - result.external_effect_status
  - result.definitely_no_external_effect
  error_codes: *id013
